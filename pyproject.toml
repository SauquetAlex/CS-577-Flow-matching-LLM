[project]
name = "cs-577-flow-matching-llm"
version = "0.1.0"
description = "CS 577 Project: flow matching with a modified Qwen3.5"
readme = "README.md"
requires-python = ">=3.14.0,<3.15"
dependencies = [
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.uv.build-backend]
module-name = "flowlm"
